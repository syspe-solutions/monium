[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "." }

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "apps*"]
exclude = ["locale*", "templates*", "static*", "logs*"]

[dependency-groups]
dev = [
    "ruff>=0.16.6",
]
