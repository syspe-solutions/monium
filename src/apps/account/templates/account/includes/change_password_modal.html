{% load i18n %}

<div id="password-modal"
     class="fixed inset-0 z-50 hidden items-center justify-center bg-black/70 backdrop-blur-sm p-4">

  <div class="bg-zinc-900 border border-zinc-800 rounded-xl shadow-2xl max-w-md w-full p-6 flex flex-col gap-5">

    <div class="flex items-center gap-2">
      <span class="material-symbols-outlined text-zinc-400 text-xl leading-none">key</span>
      <h2 class="text-base font-semibold text-white">{% trans "Change Password" %}</h2>
    </div>

    <form method="post" action="{% url 'account:recovery' %}" class="flex flex-col gap-4">
      {% csrf_token %}

      <div class="flex flex-col gap-1.5">
        <label class="text-xs font-medium text-zinc-400">{% trans "Current Password" %}</label>
        <input type="password" name="old_password"
               class="w-full border border-zinc-700 rounded px-3 py-2 text-sm bg-zinc-950 text-white
                      focus:outline-none focus:ring-2 focus:ring-zinc-600 placeholder:text-zinc-600">
      </div>

      <div class="flex flex-col gap-1.5">
        <label class="text-xs font-medium text-zinc-400">{% trans "New Password" %}</label>
        <input type="password" name="new_password1"
               class="w-full border border-zinc-700 rounded px-3 py-2 text-sm bg-zinc-950 text-white
                      focus:outline-none focus:ring-2 focus:ring-zinc-600 placeholder:text-zinc-600">
      </div>

      <div class="flex flex-col gap-1.5">
        <label class="text-xs font-medium text-zinc-400">{% trans "Confirm New Password" %}</label>
        <input type="password" name="new_password2"
               class="w-full border border-zinc-700 rounded px-3 py-2 text-sm bg-zinc-950 text-white
                      focus:outline-none focus:ring-2 focus:ring-zinc-600 placeholder:text-zinc-600">
      </div>

      <div class="flex justify-end gap-3 pt-2 border-t border-zinc-800">
        <button type="button" data-close-modal
                class="px-4 py-2 rounded text-sm text-zinc-400 bg-zinc-800 hover:bg-zinc-700 transition">
          {% trans "Cancel" %}
        </button>
        <button type="submit"
                class="px-4 py-2 rounded text-sm font-medium bg-white text-zinc-950 hover:bg-zinc-200 transition">
          {% trans "Update" %}
        </button>
      </div>
    </form>

  </div>
</div>
