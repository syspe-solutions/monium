{% load i18n %}

<footer class="w-full mt-12 border-t border-zinc-200 bg-white">
    <div class="w-full max-w-[1440px] mx-auto px-6 py-10 grid grid-cols-1 md:grid-cols-3 gap-8 text-sm text-zinc-600">
        
        <div class="flex flex-col gap-3">
            <a href="{% url 'inventory:home' %}" class="flex items-center gap-2">
                <span class="text-xl font-extrabold text-blue-600">Monium</span>
            </a>
            <p class="text-zinc-500 leading-relaxed">
                Simplifique sua gestão com estilo. Acompanhe desempenho e alcance com o Monium.
            </p>
        </div>

        <div class="flex flex-col justify-center items-center">
            <div>
                <h3 class="text-zinc-800 font-semibold mb-3 text-center">Navegação</h3>
                <ul class="space-y-2 text-center">
                    <li><a href="{% url 'inventory:home' %}" class="hover:text-blue-600 transition">Início</a></li>
                    <li><a href="{% url 'inventory:dashboard' %}" class="hover:text-blue-600 transition">Inventário</a></li>
                    <li><a href="{% url 'inventory:item_create' %}" class="hover:text-blue-600 transition">Cadastrar Item</a></li>
                </ul>
            </div>
        </div>

        <div class="flex flex-col items-start md:items-end">
            <div>
                <h3 class="text-zinc-800 font-semibold mb-3 md:text-right">Contato</h3>
                <ul class="space-y-2">
                    <li class="flex items-center gap-2 md:justify-end">
                        <span class="material-symbols-outlined text-gray-500 text-base">mail</span>
                        <a href="mailto:contato@monium.com.br" class="hover:text-blue-600 transition">
                            contato@monium.com.br
                        </a>
                    </li>
                    <li class="flex items-center gap-2 md:justify-end">
                        <span class="material-symbols-outlined text-gray-500 text-base">public</span>
                        <a href="https://monium.com.br" target="_blank" class="hover:text-blue-600 transition">
                            www.monium.com.br
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </div>

    <div class="border-t border-zinc-200 p-4 text-center text-xs text-zinc-500">
        © {% now "Y" %} Monium — Todos os direitos reservados.
    </div>
</footer>
