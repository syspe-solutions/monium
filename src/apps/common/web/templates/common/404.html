{% load i18n %}
<!DOCTYPE html>
<html lang="{{ request.LANGUAGE_CODE|default:'pt-br' }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% trans "Page Not Found" %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-950 flex items-center justify-center min-h-screen">

    <div class="text-center p-6 bg-zinc-900 border border-zinc-800 rounded-xl shadow-card">
        <h1 class="text-6xl font-bold text-white mb-4">404</h1>

        <h2 class="text-2xl font-semibold text-zinc-100 mb-4">
            {% trans "Page Not Found" %}
        </h2>

        <p class="text-zinc-400 mb-6">
            {% trans "Sorry, the page you're looking for does not exist." %}
        </p>

        <a href="/" class="px-6 py-3 bg-white text-zinc-950 rounded-lg hover:bg-zinc-200 transition font-medium">
            {% trans "Back to Home" %}
        </a>
    </div>

</body>
</html>
