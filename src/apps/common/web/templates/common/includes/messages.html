{% if messages %}
<div class="fixed top-4 right-4 z-50 flex flex-col gap-2 w-80">
    {% for message in messages %}
    <div class="flash-message flex items-center gap-2 px-4 py-3 rounded-lg border text-sm shadow transition-all duration-500
        {% if message.tags == 'error' %}bg-red-50 dark:bg-red-950 border-red-200 dark:border-red-800 text-red-600 dark:text-red-400
        {% elif message.tags == 'success' %}bg-green-50 dark:bg-green-950 border-green-200 dark:border-green-800 text-green-600 dark:text-green-400
        {% elif message.tags == 'warning' %}bg-yellow-950 border-yellow-800 text-yellow-400
        {% else %}bg-zinc-100 dark:bg-zinc-800 border-zinc-300 dark:border-zinc-700 text-zinc-800 dark:text-zinc-200{% endif %}">
        <span class="material-symbols-outlined text-base">
            {% if message.tags == 'error' %}block{% elif message.tags == 'success' %}check_circle{% elif message.tags == 'warning' %}warning{% else %}info{% endif %}
        </span>
        {{ message }}
    </div>
    {% endfor %}
</div>
{% endif %}
