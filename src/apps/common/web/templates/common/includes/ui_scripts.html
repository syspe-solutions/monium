<script>
    setTimeout(() => {
        document.querySelectorAll('.flash-message').forEach(el => {
            el.style.opacity = '0';
            el.style.transform = 'translateY(-8px)';
            setTimeout(() => el.remove(), 500);
        });
    }, 4000);

    // Toggle de mostrar/ocultar senha: delegado no document pra funcionar em
    // qualquer campo que use o botão .toggle-password, sem precisar de listener
    // por página.
    document.addEventListener('click', function (e) {
        const toggleBtn = e.target.closest('.toggle-password');
        if (!toggleBtn) return;
        const input = document.getElementById(toggleBtn.dataset.target);
        if (!input) return;
        const isHidden = input.type === 'password';
        input.type = isHidden ? 'text' : 'password';
        const icon = toggleBtn.querySelector('.material-symbols-outlined');
        if (icon) icon.textContent = isHidden ? 'visibility_off' : 'visibility';
    });

    // Loading state genérico: desabilita o botão de submit e mostra um spinner
    // enquanto o form está em voo, pra qualquer form da aplicação.
    document.addEventListener('submit', function (e) {
        const form = e.target;
        if (!(form instanceof HTMLFormElement)) return;
        const btn = e.submitter || form.querySelector('button[type="submit"]');
        if (!btn || btn.tagName !== 'BUTTON' || btn.disabled) return;
        // setTimeout(0): desabilitar o botão *dentro* do listener de submit,
        // antes do navegador montar o corpo da requisição, remove o próprio
        // name/value do botão clicado do POST (afeta qualquer botão que carregue
        // dado via name/value, como o seletor de idioma — name="language").
        // Adiando pro próximo tick, o navegador já capturou o submitter.
        setTimeout(function () {
            btn.disabled = true;
            btn.classList.add('opacity-70', 'cursor-wait');
            btn.insertAdjacentHTML(
                'beforeend',
                '<span class="inline-block w-4 h-4 border-2 border-current/30 border-t-current rounded-full animate-spin ml-2 align-middle"></span>'
            );
        }, 0);
    });
</script>
