{% load static i18n %}
<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE|default:'pt-br' }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% trans "Server error" %} — Monium</title>

    {% include "common/includes/fonts.html" %}
    <link rel="stylesheet" type="text/css" href="{% static 'common/css/tailwind.css' %}">
    <link rel="icon" type="image/x-icon" sizes="32x32" href="{% static 'common/favicon.ico' %}">
</head>
<body class="bg-white min-h-screen flex items-center justify-center font-sans p-4">
    <div class="flex flex-col items-center gap-4 text-center max-w-md sm:max-w-xl">
        <span class="material-symbols-outlined text-5xl text-red-600">cloud_off</span>

        <h1 class="flex flex-col items-center gap-1 text-zinc-900 font-bold">
            <span class="text-sm tracking-widest text-zinc-500">500</span>
            <span class="text-xl sm:text-2xl">{% trans "Something went wrong on our end" %}</span>
        </h1>

        <p class="text-sm sm:text-base leading-relaxed text-zinc-500">
            {% trans "We've been notified and are already looking into it. Please try again in a few minutes." %}
        </p>

        <a href="/"
           class="w-fit flex items-center gap-1 px-4 py-2.5 text-sm font-medium rounded transition
                  bg-zinc-900 text-white hover:bg-zinc-800 mt-2">
            <span class="material-symbols-outlined text-base leading-none">home</span>
            {% trans "Back to Home" %}
        </a>
    </div>

</body>
</html>
