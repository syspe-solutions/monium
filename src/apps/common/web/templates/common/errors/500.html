{% load static i18n %}
<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE|default:'pt-br' }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% trans "Server error" %} — Monium</title>

    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,0" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="{% static 'common/css/tailwind.css' %}">
    <link rel="icon" type="image/x-icon" sizes="32x32" href="{% static 'common/favicon.ico' %}">
</head>
<body class="bg-zinc-950 min-h-screen flex items-center justify-center font-[Inter] p-4">
    <div class="flex flex-col items-center gap-4 text-center max-w-md sm:max-w-xl">
        <span class="material-symbols-outlined text-5xl text-red-400">cloud_off</span>

        <h1 class="flex flex-col items-center gap-1 text-white font-bold">
            <span class="text-sm tracking-widest text-zinc-500">500</span>
            <span class="text-xl sm:text-2xl">{% trans "Something went wrong on our end" %}</span>
        </h1>

        <p class="text-sm sm:text-base leading-relaxed text-zinc-400">
            {% trans "We've been notified and are already looking into it. Please try again in a few minutes." %}
        </p>

        <a href="/"
           class="w-fit flex items-center gap-1 px-4 py-2.5 text-sm font-medium rounded transition
                  bg-white text-zinc-950 hover:bg-zinc-100 mt-2">
            <span class="material-symbols-outlined text-base leading-none">home</span>
            {% trans "Back to Home" %}
        </a>
    </div>

</body>
</html>
