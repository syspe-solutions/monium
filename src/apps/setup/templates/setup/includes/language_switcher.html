{% load i18n %}
{% get_current_language as LANGUAGE_CODE %}
<form action="{% url 'set_language' %}" method="post"
      class="flex items-center gap-1 bg-white border border-zinc-200 rounded-full p-1">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ request.get_full_path }}">
    <button type="submit" name="language" value="pt-br"
            class="px-3 py-1 rounded-full text-xs font-semibold transition
                   {% if LANGUAGE_CODE == 'pt-br' %}bg-zinc-900 text-white{% else %}text-zinc-500 hover:text-zinc-900{% endif %}">
        PT
    </button>
    <button type="submit" name="language" value="en"
            class="px-3 py-1 rounded-full text-xs font-semibold transition
                   {% if LANGUAGE_CODE == 'en' %}bg-zinc-900 text-white{% else %}text-zinc-500 hover:text-zinc-900{% endif %}">
        EN
    </button>
</form>
