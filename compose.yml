services:
  monium:
    container_name: monium
    env_file:
      - ./src/.env
    image: ghcr.io/syspe-tech/monium:latest
    build:
      context: ./src
      dockerfile: Dockerfile
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${APP_PORT:-8088}:8000"
    volumes:
      - ./src/logs:/usr/src/logs
      - app_data:/usr/src/data
    networks:
      - monium_net
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/health/ | grep -qE '^[23]'"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s

networks:
  monium_net:
    driver: bridge

volumes:
  app_data:
