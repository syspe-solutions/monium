# -------------------------------
# API ACCESS CONTROL
# -------------------------------
map $http_origin $api_origin_allowed {
    default                 0;
    "http://localhost:3000"  1;
    "http://127.0.0.1:3000"  1;
}

geo $api_ip_allowed {
    default         0;
    127.0.0.1       1;
    ::1             1;
    172.16.0.0/12   1;
    10.0.0.0/8      1;
}

# -------------------------------
# UPSTREAMS
# -------------------------------
upstream monium {
    server monium:8000;
}

# 1) localhost HTTP (Django)
server {
    listen 80;
    server_name localhost 127.0.0.1 _;

    client_max_body_size 10M;
    server_tokens off;

    location /api/ {
        set $api_ok "${api_origin_allowed}${api_ip_allowed}";
        if ($api_ok = "00") {
            return 403;
        }

        proxy_pass http://monium;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://monium;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://monium;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/admin/ {
        alias /usr/share/nginx/html/admin/;
    }

    location /static/ {
        alias /usr/share/nginx/html/;
        access_log off;
        expires 1y;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}
