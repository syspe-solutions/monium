map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# -------------------------------
# API ACCESS CONTROL
# -------------------------------
map $http_origin $api_origin_allowed {
    default                      0;
    "https://monium.com.br"      1;
    "https://www.monium.com.br"  1;
}

geo $api_ip_allowed {
    default         0;
    127.0.0.1       1;
    ::1             1;
    172.16.0.0/12   1;
    10.0.0.0/8      1;
}

# -------------------------------
# UPSTREAMS
# -------------------------------
upstream monium {
    server monium:8000;
}

# -------------------------------
# MAIN SITE (monium.com.br + www)
# -------------------------------
server {
    listen 80;
    server_name monium.com.br www.monium.com.br;

    client_max_body_size 10M;
    server_tokens off;

    access_log /var/log/nginx/monium_access.log;
    error_log /var/log/nginx/monium_error.log warn;

    error_page 500 502 503 504 /maintenance.html;

    location = /maintenance.html {
        root /usr/share/nginx/html;
        internal;
    }

    if ($host = 'www.monium.com.br') {
        return 301 https://monium.com.br$request_uri;
    }

    if (-f /usr/share/nginx/html/maintenance.flag) {
        return 503;
    }

    location ~* (\.env|\.git|\.svn|\.htaccess|wp-admin|wp-content|wp-includes|xmlrpc\.php|phpmyadmin|pma|cgi-bin|\.well-known|\.DS_Store) {
        access_log off;
        log_not_found off;
        return 444;
    }

    location /static/ {
        alias /usr/share/nginx/html/;
        expires 1y;
        add_header Cache-Control "public";
        try_files $uri =404;

        access_log /var/log/nginx/monium_static_access.log;
    }

    location /ws/ {
        proxy_pass http://monium;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        proxy_buffering off;
        proxy_intercept_errors on;
    }

    location /api/ {
        set $api_ok "${api_origin_allowed}${api_ip_allowed}";
        if ($api_ok = "00") {
            return 403;
        }

        proxy_pass http://monium;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_intercept_errors on;
    }

    location / {
        proxy_pass http://monium;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_intercept_errors on;
    }
}