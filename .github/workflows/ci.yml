name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DJANGO_DEBUG: "FALSE"
  DJANGO_SECRET_KEY: "ci-dummy-secret-key-not-for-production-use-only"
  # Chave Fernet válida (32 bytes url-safe base64) só para os testes rodarem;
  # não é usada para proteger dado real nenhum neste pipeline.
  DJANGO_ENCRYPTION_KEY: "Zm9vYmFyYmF6cXV4Zm9vYmFyYmF6cXV4Zm9vYmFyYmF6PQ=="
  DB_ENGINE: "sqlite3"

jobs:
  python:
    name: Lint & test (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps for python-ldap
        run: sudo apt-get update && sudo apt-get install -y libldap2-dev libsasl2-dev

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync

      - name: Ruff
        run: uv run ruff check .

      - name: Django tests
        run: uv run python manage.py test

  node:
    name: Build assets (Node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: src/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Build assets
        run: npm run build
