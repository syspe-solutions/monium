name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DJANGO_DEBUG: "FALSE"
  DJANGO_SECRET_KEY: "ci-dummy-secret-key-not-for-production-use-only"
  # Chave Fernet válida (32 bytes url-safe base64) só para os testes rodarem;
  # não é usada para proteger dado real nenhum neste pipeline.
  DJANGO_ENCRYPTION_KEY: "Zm9vYmFyYmF6cXV4Zm9vYmFyYmF6cXV4Zm9vYmFyYmF6PQ=="
  DB_ENGINE: "sqlite3"

jobs:
  python:
    name: Lint & test (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps for python-ldap
        run: sudo apt-get update && sudo apt-get install -y libldap2-dev libsasl2-dev

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "src/uv.lock"

      - name: Set up Python
        # Mesma versão do estágio de runtime do Dockerfile (python:3.11-slim) —
        # testar numa versão diferente da que roda em produção esconderia
        # incompatibilidades só descobertas no build da imagem.
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff
        run: uv run ruff check .

      - name: Check for missing migrations
        run: uv run python manage.py makemigrations --check --dry-run

      - name: Django tests
        run: uv run python manage.py test

  node:
    name: Build assets (Node)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: src/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build assets
        run: npm run build
